<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub App Frontend Dashboard</title>

    <style>
      :root {
        --bg-canvas: #0d1117;
        --bg-surface: #161b22;
        --bg-button: #21262d;
        --bg-button-hover: #30363d;
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --accent-blue: #58a6ff;
        --border-default: #30363d;
        --error: #ff7b72;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
          sans-serif;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      .container,
      .dashboard-card {
        width: 100%;
        max-width: 500px;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: 6px;
        padding: 24px;
      }

      .container {
        margin-bottom: 24px;
        text-align: center;
      }

      h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: var(--accent-blue);
      }

      .input-group {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      input {
        flex: 1;
        min-width: 0;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        border: 1px solid var(--border-default);
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 6px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent-blue);
      }

      button {
        background-color: var(--bg-button);
        color: var(--text-primary);
        border: 1px solid var(--border-default);
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: var(--bg-button-hover);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .dashboard-card {
        display: none;
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
        margin-bottom: 16px;
      }

      .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1px solid var(--border-default);
      }

      .profile-name {
        margin: 0 0 4px;
        font-size: 20px;
      }

      .profile-login {
        color: var(--text-secondary);
        font-size: 14px;
      }

      .profile-bio {
        color: var(--text-secondary);
        font-size: 14px;
        margin: 12px 0;
        line-height: 1.5;
        text-align: left;
      }

      .profile-stats {
        font-size: 14px;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-default);
        text-align: left;
      }

      .stat {
        color: var(--accent-blue);
        font-weight: 600;
      }

      .repo-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
        text-align: left;
      }

      .repo-list {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 300px;
        overflow-y: auto;
        text-align: left;
      }

      .repo-item {
        padding: 10px 0;
        border-bottom: 1px solid var(--border-default);
        font-size: 14px;
      }

      .repo-item:last-child {
        border-bottom: none;
      }

      .repo-link {
        color: var(--accent-blue);
        text-decoration: none;
        font-weight: 600;
      }

      .repo-link:hover {
        text-decoration: underline;
      }

      .repo-meta {
        color: var(--text-secondary);
        font-size: 12px;
        margin-top: 4px;
      }

      .error-msg {
        color: var(--error);
        font-size: 14px;
        margin-top: 12px;
        display: none;
      }

      .loading {
        color: var(--text-secondary);
        font-size: 14px;
        margin-top: 16px;
        display: none;
      }

      .profile-link {
        display: inline-block;
        margin-top: 16px;
        color: var(--accent-blue);
        font-size: 14px;
        text-decoration: none;
      }

      .profile-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>GitHub Web Profile Dashboard</h2>

      <div class="input-group">
        <input
          type="text"
          id="usernameInput"
          placeholder="Type a GitHub username..."
          autocomplete="off"
        />

        <button id="searchButton" type="button">Search</button>
      </div>

      <div id="loading" class="loading">Loading GitHub profile...</div>

      <div id="errorBox" class="error-msg"></div>
    </div>

    <div id="dashboardCard" class="dashboard-card">
      <div class="profile-header">
        <img
          id="profileAvatar"
          class="avatar"
          src=""
          alt="GitHub profile avatar"
        />

        <div>
          <h3 id="profileName" class="profile-name">--</h3>
          <div id="profileLogin" class="profile-login">@--</div>
        </div>
      </div>

      <div id="profileBio" class="profile-bio">--</div>

      <div class="profile-stats">
        Public Repos:
        <span id="statRepos" class="stat">0</span>
        | Followers:
        <span id="statFollowers" class="stat">0</span>
      </div>

      <div class="repo-title">📦 Public Repositories</div>

      <ul id="repoList" class="repo-list"></ul>

      <a
        id="profileLink"
        class="profile-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        View GitHub Profile →
      </a>
    </div>

    <script>
      const usernameInput = document.getElementById('usernameInput');
      const searchButton = document.getElementById('searchButton');
      const errorBox = document.getElementById('errorBox');
      const loading = document.getElementById('loading');
      const dashboardCard = document.getElementById('dashboardCard');

      const profileAvatar = document.getElementById('profileAvatar');
      const profileName = document.getElementById('profileName');
      const profileLogin = document.getElementById('profileLogin');
      const profileBio = document.getElementById('profileBio');
      const statRepos = document.getElementById('statRepos');
      const statFollowers = document.getElementById('statFollowers');
      const repoList = document.getElementById('repoList');
      const profileLink = document.getElementById('profileLink');

      usernameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          fetchProfileData();
        }
      });

      searchButton.addEventListener('click', fetchProfileData);

      async function fetchProfileData() {
        const username = usernameInput.value.trim();

        if (!username) {
          showError('Please enter a GitHub username.');
          return;
        }

        resetState();
        setLoading(true);

        try {
          /*
           * GitHub REST API endpoints.
           *
           * IMPORTANT:
           * github.com/<username>
           * is the web page.
           *
           * api.github.com/users/<username>
           * is the REST API.
           */

          const userUrl = `https://api.github.com/users/${encodeURIComponent(username)}`;

          const reposUrl =
            `https://api.github.com/users/${encodeURIComponent(username)}/repos` +
            `?per_page=15&sort=updated`;

          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          // Fetch profile and repositories in parallel.
          const [userRes, reposRes] = await Promise.all([
            fetch(userUrl, { headers }),
            fetch(reposUrl, { headers }),
          ]);

          if (userRes.status === 404) {
            showError(`User "${username}" does not exist.`);
            return;
          }

          if (userRes.status === 403 || reposRes.status === 403) {
            showError(
              'GitHub API rate limit exceeded. Please wait and try again.',
            );
            return;
          }

          if (!userRes.ok) {
            throw new Error(
              `GitHub API error: ${userRes.status} ${userRes.statusText}`,
            );
          }

          if (!reposRes.ok) {
            throw new Error(
              `Repository API error: ${reposRes.status} ${reposRes.statusText}`,
            );
          }

          const userData = await userRes.json();
          const reposData = await reposRes.json();

          renderProfile(userData);
          renderRepositories(reposData);

          dashboardCard.style.display = 'block';
        } catch (error) {
          console.error(error);

          showError(
            'Unable to load the GitHub profile. Please check your connection and try again.',
          );
        } finally {
          setLoading(false);
        }
      }

      function renderProfile(user) {
        profileAvatar.src = user.avatar_url;
        profileAvatar.alt = `${user.login}'s GitHub avatar`;

        profileName.textContent = user.name || user.login;
        profileLogin.textContent = `@${user.login}`;

        profileBio.textContent = user.bio || 'No bio available.';

        statRepos.textContent = user.public_repos;
        statFollowers.textContent = user.followers;

        profileLink.href = user.html_url;
      }

      function renderRepositories(repositories) {
        repoList.innerHTML = '';

        if (!repositories.length) {
          const li = document.createElement('li');
          li.className = 'repo-item';
          li.textContent = 'No public repositories found.';
          repoList.appendChild(li);
          return;
        }

        repositories.forEach((repo) => {
          const li = document.createElement('li');
          li.className = 'repo-item';

          const link = document.createElement('a');
          link.className = 'repo-link';
          link.href = repo.html_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = `📦 ${repo.name}`;

          const meta = document.createElement('div');
          meta.className = 'repo-meta';

          const metadata = [];

          if (repo.language) {
            metadata.push(repo.language);
          }

          metadata.push(`${repo.stargazers_count} ⭐`);

          metadata.push(`${repo.forks_count} forks`);

          meta.textContent = metadata.join(' · ');

          li.appendChild(link);
          li.appendChild(meta);

          repoList.appendChild(li);
        });
      }

      function resetState() {
        errorBox.style.display = 'none';
        dashboardCard.style.display = 'none';
        repoList.innerHTML = '';
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function setLoading(isLoading) {
        loading.style.display = isLoading ? 'block' : 'none';
        searchButton.disabled = isLoading;
        usernameInput.disabled = isLoading;
      }
    </script>
  </body>
</html>
