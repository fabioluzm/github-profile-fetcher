name: Execute GitHub App Fetcher

on:
  workflow_dispatch: # Allows manual triggers in the browser
  push: # FORCES GitHub to register and run the workflow right now
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  run-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Layout
        uses: actions/checkout@v4

      - name: Install Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify exact minor version format

      - name: Install Dependencies
        run: |
          pip install PyJWT cryptography requests

      - name: Reconstruct the Private Key File dynamically
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem

      - name: Run Headless Application Script
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: python run_app.py

      - name: Commit and Save the Profile Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile_report.md || true
          git commit -m "Docs: update fetched profile report markdown asset [skip ci]" || true
          git push || true
